<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FDFCFA;
      color: #3A3840;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      background: rgba(130,153,135,0.06);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #C8C7C2;
    }
    .status-dot.connected { background: #829987; }
    .status-dot.error { background: #B56A5B; }
    .status-text {
      font-size: 12px;
      color: #666159;
    }
    .stats {
      padding: 12px 16px;
      display: flex;
      gap: 16px;
    }
    .stat {
      flex: 1;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: #3A3840;
    }
    .stat-label {
      font-size: 10px;
      color: #9A958D;
      margin-top: 2px;
    }
    .actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      height: 36px;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #829987;
      color: #fff;
    }
    .btn-primary:hover { background: #6E8A73; }
    .btn-secondary {
      background: rgba(0,0,0,0.04);
      color: #666159;
    }
    .btn-secondary:hover { background: rgba(0,0,0,0.07); }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .footer {
      padding: 8px 16px 12px;
      text-align: center;
      font-size: 10px;
      color: #A8A29E;
    }
    .footer a {
      color: #829987;
      text-decoration: none;
    }
    .recent {
      padding: 0 16px 12px;
    }
    .recent-title {
      font-size: 10px;
      color: #9A958D;
      margin-bottom: 6px;
    }
    .recent-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .recent-item:last-child { border-bottom: none; }
    .recent-thumb {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #E8E5DE;
      object-fit: cover;
    }
    .recent-info {
      flex: 1;
      min-width: 0;
    }
    .recent-name {
      font-size: 11px;
      font-weight: 500;
      color: #3A3840;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recent-time {
      font-size: 9px;
      color: #A8A29E;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #829987;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(130,153,135,0.2);
      border-top-color: #829987;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>Kanbox</h1>
    <span style="font-size: 10px; color: #A8A29E;">v0.8.17</span>
  </div>

  <div id="status" class="status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">检查连接中...</span>
  </div>

  <div id="statsContainer" class="stats" style="display: none;">
    <div class="stat">
      <div class="stat-value" id="totalCount">-</div>
      <div class="stat-label">已收藏</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="todayCount">-</div>
      <div class="stat-label">今日</div>
    </div>
  </div>

  <div id="platformSection" style="padding: 8px 16px; display: none;">
    <div style="display: flex; align-items: center; gap: 6px; font-size: 10px; color: #9A958D;">
      <span>当前平台:</span>
      <span id="platformName" style="color: #829987; font-weight: 600;">-</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="saveCurrentBtn" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      收藏当前笔记
    </button>
    <button class="btn btn-secondary" id="openAppBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      打开 Kanbox
    </button>
  </div>

  <div id="recentContainer" class="recent" style="display: none;">
    <div class="recent-title">最近收藏</div>
    <div id="recentList"></div>
  </div>

  <div class="footer">
    <a href="https://github.com/sexyfeifan/Kanbox" target="_blank">GitHub</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
